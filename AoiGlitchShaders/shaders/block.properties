# =============================================================================
#  AoiGlitch — block.properties  ->  mc_Entity.x in gbuffers_terrain / shadow
#  Unknown names are ignored, so old and new names can both be listed
#  (e.g. "grass" before 1.20.3, "short_grass" since 1.20.3).
#  Iris 1.7+ also accepts block tags, e.g.:  block.10001 = #minecraft:leaves
# =============================================================================

# Leaves -> "jelly"
block.10001 = oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves \
  dark_oak_leaves mangrove_leaves cherry_leaves azalea_leaves flowering_azalea_leaves

# Single-block plants -> bend from the root, tip moves most
block.10002 = short_grass grass fern dead_bush dandelion poppy blue_orchid allium \
  azure_bluet red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy cornflower \
  lily_of_the_valley wither_rose torchflower oak_sapling spruce_sapling birch_sapling \
  jungle_sapling acacia_sapling dark_oak_sapling cherry_sapling mangrove_propagule \
  wheat carrots potatoes beetroots torchflower_crop sweet_berry_bush \
  crimson_roots warped_roots nether_sprouts seagrass

# Double plants, lower half (root fixed, top of the half moves 50 %)
block.10003 = tall_grass:half=lower large_fern:half=lower sunflower:half=lower \
  lilac:half=lower rose_bush:half=lower peony:half=lower pitcher_plant:half=lower \
  tall_seagrass:half=lower

# Double plants, upper half (continues from 50 % to 100 %)
block.10004 = tall_grass:half=upper large_fern:half=upper sunflower:half=upper \
  lilac:half=upper rose_bush:half=upper peony:half=upper pitcher_plant:half=upper \
  tall_seagrass:half=upper

# Water -> procedural water shader
block.10010 = water

# Light sources -> a little extra glow for the bloom
block.10020 = lava glowstone sea_lantern shroomlight jack_o_lantern torch wall_torch \
  soul_torch soul_wall_torch lantern soul_lantern redstone_lamp:lit=true end_rod \
  ochre_froglight verdant_froglight pearlescent_froglight beacon magma_block \
  campfire:lit=true soul_campfire:lit=true fire soul_fire
