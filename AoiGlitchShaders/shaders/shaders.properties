# =============================================================================
#  AoiGlitch — shaders.properties  (Minecraft 1.20.4, Iris 1.7+ / OptiFine HD U I7+)
# =============================================================================

# ---- Vanilla features we replace ---------------------------------------------
# Clouds: completely off (gbuffers_clouds also discards, as a safety net).
clouds = off
# Vanilla sun / moon squares: off, lib/sky.glsl draws a glowing diamond sun.
sun = false
moon = false
# We do our own soft directional shading and keep AO separate (vertex alpha).
oldLighting = false
separateAo = true
underwaterOverlay = false
vignette = false
dynamicHandLight = true

# ---- Program toggles (expressions on the GUI options) -------------------------
program.shadow.enabled = SHADOWS
program.composite1.enabled = BLOOM
program.composite2.enabled = BLOOM

# ---- Custom textures: Japanese glyph atlas (16 x 16 glyphs, 512 x 512) --------
# Iris: bind by sampler name -> "uniform sampler2D jpTextAtlas;" in any program.
customTexture.jpTextAtlas = textures/jp_atlas.png
# OptiFine: classic custom texture slot, read in composite.fsh as colortex12.
texture.composite.colortex12 = textures/jp_atlas.png

# ---- Custom uniforms: parameters that change at runtime ------------------------
# (evaluated by the loader every frame; the GLSL side is in lib/params.glsl)
# Wind direction slowly veers +-20 degrees around 34 deg; period 360 s divides
# the 3600 s wrap of frameTimeCounter, so there is no jump when it wraps.
variable.float.windAngle = 0.6 + 0.35 * sin(frameTimeCounter * 0.0174533)
uniform.vec2.windDirection = vec2(cos(windAngle), sin(windAngle))
# Wind gets stronger with rain (multiplies the WIND_STRENGTH option).
uniform.float.windStrength = 1.0 + 0.9 * rainStrength
# Sky style 3: morph burst <-> ink and back every 120 s.
uniform.float.skyMorph = 0.5 + 0.5 * sin(frameTimeCounter * 0.0523599)

# ---- Options menu ----------------------------------------------------------------
screen = [SKY] [TEXT] [WATER] [PLAYERS] [FOLIAGE] [LIGHT] [ATMOSPHERE] [SHADOWS] [PIXELS]
screen.SKY = SKY_STYLE SKY_MIX SKY_WARP SKY_SPEED SKY_RAYS SKY_TWIST SKY_BURST_CENTER SKY_INK_DENSITY SKY_DROPS SKY_WINDOWS SKY_STARS SKY_NIGHT_STYLE SUN_SIZE sunPathRotation
screen.TEXT = SKY_TEXT SKY_TEXT_SIZE SKY_TEXT_DENSITY SKY_TEXT_OPACITY SKY_TEXT_FLICKER SKY_TEXT_GLITCH SKY_TEXT_GRAIN
screen.WATER = WATER_STYLE WATER_SCALE WATER_SPEED WATER_WARP WATER_GRAIN WATER_ALPHA
screen.PLAYERS = PLAYER_GLITCH GLITCH_ALL_ENTITIES GLITCH_INTENSITY NOISE_AMOUNT NOISE_STYLE GLITCH_RATE
screen.FOLIAGE = WAVING_PLANTS JELLY_LEAVES WIND_STRENGTH WIND_SPEED JELLY_AMPLITUDE JELLY_FREQUENCY
screen.PIXELS = PIXELATION PIXEL_START_DISTANCE PIXEL_END_DISTANCE PIXEL_MAX_SIZE PIXEL_SKY_SIZE PIXEL_GROUT
screen.LIGHT = LIGHT_PATCHES LIGHT_PATCHES_STRENGTH GODRAYS GODRAYS_STRENGTH TORCH_FLICKER FOLIAGE_GLOW
screen.ATMOSPHERE = BLOOM BLOOM_INTENSITY BLOOM_THRESHOLD FOG_DENSITY COLOR_SATURATION PASTEL_AMOUNT SHADOW_LIFT VIGNETTE FILM_GRAIN
screen.SHADOWS = SHADOWS SHADOW_DARKNESS SHADOW_SOFTNESS AO_STRENGTH shadowMapResolution shadowDistance

sliders = SKY_MIX SKY_WARP SKY_SPEED SKY_RAYS SKY_TWIST SKY_INK_DENSITY SUN_SIZE sunPathRotation \
  SKY_TEXT_SIZE SKY_TEXT_DENSITY SKY_TEXT_OPACITY SKY_TEXT_FLICKER SKY_TEXT_GLITCH SKY_TEXT_GRAIN \
  WATER_SCALE WATER_SPEED WATER_WARP WATER_GRAIN WATER_ALPHA \
  GLITCH_INTENSITY NOISE_AMOUNT GLITCH_RATE \
  WIND_STRENGTH WIND_SPEED JELLY_AMPLITUDE JELLY_FREQUENCY \
  PIXEL_START_DISTANCE PIXEL_END_DISTANCE PIXEL_MAX_SIZE PIXEL_SKY_SIZE PIXEL_GROUT \
  BLOOM_INTENSITY BLOOM_THRESHOLD FOG_DENSITY COLOR_SATURATION PASTEL_AMOUNT SHADOW_LIFT VIGNETTE FILM_GRAIN \
  SHADOW_DARKNESS SHADOW_SOFTNESS AO_STRENGTH shadowMapResolution shadowDistance \
  LIGHT_PATCHES_STRENGTH GODRAYS_STRENGTH FOLIAGE_GLOW
